{% extends 'base.html' %}

{% block content %}
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<h2>Pengaturan Master Data</h2>
<hr>

<div class="row">
    <div class="col-md-4">
        <div class="card p-3">
            <h5>Tambah Kategori Baru</h5>
            <form method="POST">
                <select name="tipe" class="form-control mb-2">
                    <option value="cabang">Cabang Baru</option>
                    <option value="penjualan">Nama Item Penjualan</option>
                    <option value="pengeluaran">Nama Jenis Pengeluaran</option>
                </select>
                <input type="text" name="nama" class="form-control mb-2" placeholder="Nama..." required>
                <button type="submit" class="btn btn-primary w-100">Simpan</button>
            </form>
        </div>
    </div>

    <div class="col-md-8">
        <h5>Daftar Cabang Aktif</h5>
        <ul class="list-group mb-3">
            {% for c in cabang %}
            <li class="list-group-item">{{ c.nama }}</li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
